<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diacritificatorul</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
  <style>
    :root {
      --desk: #413d3d;
      --paper: #040004;
      --ink: #ece8e8;
      --muted: #a39d9d;
      --rule: #413d3d;
      --margin: #8a0a28;
      --red: #fa023c;
      --card: #1c1919;
      --red-text: #c8ff00; /* lime: text accents; red: pen strokes */
      --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 18px 40px -22px rgb(0 0 0 / .9);
      --line: 2rem;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    /* Icons: Lucide outlines (ISC), inlined; they take the text colour and size. */
    .icon {
      width: 1em; height: 1em; margin-right: .35em; vertical-align: -.125em; flex: none;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .icon.pen { color: var(--red); }
    .icon.lime { color: var(--red-text); }
    #copy:not(.done) .done-i, #copy.done .copy-i { display: none; }
    ::selection { background: var(--red-text); color: var(--paper); }
    body {
      margin: 0;
      background: var(--paper); /* same page colour as about.html */
      color: var(--ink);
      font-family: "Literata", Georgia, serif;
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    /* Two full-screen panes, edge to edge. On wide screens both panes share the same four row
       tracks (subgrid), so the ruled lines of the two sheets sit at the same height. */
    main { --pad: 1rem; }
    .sheet {
      display: flex; flex-direction: column; gap: 1rem;
      min-width: 0;
      padding: 1.5rem var(--pad) 0;
      background: var(--card);
    }
    /* One header across the whole page, then the two sheets. */
    .site {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem 2rem;
      padding: 1.25rem var(--pad);
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
    }
    /* One footer across the page too: model status on the left, what the page does on the right. */
    .site-foot {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem 2rem;
      padding: 1rem var(--pad) 1.25rem;
      background: var(--paper);
    }
    @media (min-width: 56rem) {
      main {
        --pad: 2rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto 1fr auto;
        gap: 0 1px; /* the divider: equal columns, so both panes wrap at the same words */
        height: 100dvh;
        background: var(--rule);
      }
      .site, .site-foot { grid-column: 1 / -1; }
      .sheet { display: grid; grid-row: 2 / 4; grid-template-rows: subgrid; gap: 0; }
      .sheet-head { grid-row: 1; margin-bottom: .5rem; }
      .page { grid-row: 2; }
      .site-foot .lede { text-align: right; }
    }

    /* Menu: plain links with an icon each, underlined in red on hover like the rest of the site. */
    .menu { display: flex; flex-wrap: wrap; align-items: center; gap: 0 1.5rem; margin: -.5rem 0; font-size: .9375rem; }
    .menu a {
      display: inline-flex; align-items: center; min-height: 44px;
      color: var(--ink); text-decoration: underline 2px transparent; text-underline-offset: .3em;
      transition: text-decoration-color 120ms;
    }
    .menu a:hover { text-decoration-color: var(--red); }
    .menu a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
    .menu .icon { color: var(--muted); }

    .brand { display: flex; align-items: center; gap: clamp(.75rem, 2vw, 1.25rem); }
    .logo {
      flex: none;
      width: clamp(2.25rem, 4vw, 2.75rem);
      height: auto;
      filter: drop-shadow(0 6px 10px rgb(58 55 64 / .18));
    }
    .logo .paper { fill: var(--paper); stroke: var(--rule); }
    .logo .rule { stroke: var(--rule); }
    .logo .margin { stroke: var(--margin); }
    .logo .ink { fill: var(--ink); }
    .logo .pen { stroke: var(--red); }

    h1 {
      position: relative;
      width: fit-content;
      margin: 0;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-variation-settings: "opsz" 72;
      font-weight: 650;
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    /* The teacher's red pen underlines the title as the model downloads: the script moves
       --p from 0 to 1, so the stroke doubles as the progress bar. */
    h1 svg {
      position: absolute;
      left: -1%;
      bottom: -.32em;
      width: 102%;
      height: .32em;
      overflow: visible;
    }
    h1 path {
      fill: none;
      stroke: var(--red);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 1 2; /* gap longer than the path, so no cap dot shows at the far end */
      stroke-dashoffset: calc(1 - var(--p, 0));
      transition: stroke-dashoffset 450ms cubic-bezier(.33, 1, .68, 1);
    }

    .lede { max-width: 34rem; margin: 0; font-size: .9375rem; color: var(--muted); }

    .sheet-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
      margin-bottom: .5rem;
    }
    .sheet-head label, .sheet-head h2 {
      margin: 0; font-size: 1rem; font-weight: 600; font-style: italic;
    }

    /* Notebook sheets: ruled lines that scroll with the text, a red margin line. Each pane
       scrolls on its own and the script keeps the two in step. */
    .page {
      width: calc(100% + 2 * var(--pad));
      height: 50dvh;
      min-height: 16rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent;
      margin: 0 calc(-1 * var(--pad));
      padding: .75rem var(--pad) .75rem calc(var(--pad) + 1.5rem);
      border: 0;
      border-block: 1px solid var(--rule);
      color: var(--ink);
      font: inherit;
      font-size: 1.1875rem;
      line-height: var(--line);
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, transparent calc(var(--pad) + .5rem), var(--margin) calc(var(--pad) + .5rem),
                        var(--margin) calc(var(--pad) + .5rem + 1px), transparent calc(var(--pad) + .5rem + 1px)),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px),
                                  var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
      background-position: 0 0, 0 calc(.75rem - 5px); /* rules just under the baseline */
      background-attachment: local;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      /* The <mark> around each added letter breaks kerning and ligature pairs, which made the
         output a few pixels wider than the input. Without them both panes wrap at the same words. */
      font-kerning: none;
      font-variant-ligatures: none;
    }
    @media (min-width: 56rem) { .page { height: auto; min-height: 0; } }
    textarea.page { resize: none; }
    textarea.page::placeholder { color: var(--muted); font-style: italic; }
    textarea.page:disabled { cursor: progress; }
    .page:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

    #output .empty { color: var(--muted); font-style: italic; }
    #output mark {
      position: relative;
      background: none;
      /* A quiet tint of the lime: easy to spot, not shouting over the text around it. */
      color: color-mix(in srgb, var(--red-text) 45%, var(--ink));
    }
    #output mark.fresh { animation: ink 900ms ease-out; }
    @keyframes ink {
      /* A fresh letter flashes full lime once, then settles to the tint. */
      from { color: var(--ink); }
      30% { color: var(--red-text); }
    }
    /* Hovering a mark shows the letter it replaced. */
    #output mark::after {
      content: attr(data-from);
      position: absolute;
      left: 50%;
      bottom: 1.3em;
      translate: -50% .2em;
      padding: .05em .45em;
      border-radius: 4px;
      background: var(--ink);
      color: var(--paper);
      font-size: .85em;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms, translate 120ms;
    }
    #output mark:is(:hover, .shown)::after { opacity: 1; translate: -50% 0; }

    button {
      font: inherit; font-size: .9375rem; color: var(--ink);
      background: none; border: 0; cursor: pointer;
      /* 44px tap target; the negative margin keeps the header row as tall as the text. */
      min-height: 44px; padding: 0; margin: -.75rem 0;
      text-decoration: underline; text-decoration-color: var(--margin);
      text-decoration-thickness: 2px; text-underline-offset: .3em;
      transition: text-decoration-color 120ms;
    }
    button:hover { text-decoration-color: var(--red); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
    button:disabled { color: var(--muted); cursor: default; text-decoration: none; }

    .status { margin: 0; min-height: 1.6em; font-size: .9375rem; color: var(--muted); }
    .status.error { color: var(--red-text); }
    .count { color: var(--red-text); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      h1 path { transition: none; }
      .menu a { transition: none; }
      #output mark.fresh { animation: none; }
      #output mark::after, button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="site">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <clipPath id="logo-page"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
          <rect class="paper" x="2.5" y="2.5" width="59" height="59" rx="13.5"/>
          <g clip-path="url(#logo-page)" fill="none" stroke-width="1">
            <path class="rule" d="M2 16H62M2 28H62M2 40H62M2 52H62"/>
            <path class="margin" d="M14 2V62"/>
          </g>
          <path class="ink" d="M31.66 51Q28.56 51 26.83 49.38Q25.1 47.76 25.1 44.77Q25.1 42.39 26.33 40.91Q27.56 39.44 30.42 38.65Q33.28 37.86 38.17 37.62V31.77Q38.17 29.96 37.75 28.87Q37.32 27.78 36.39 27.28Q35.47 26.78 33.97 26.78Q32.63 26.78 31.16 27.25Q29.69 27.72 28.94 28.47Q30.05 29.7 30.6 30.52Q31.15 31.34 31.34 31.87Q31.54 32.4 31.54 32.83Q31.54 33.76 30.76 34.46Q29.97 35.17 28.52 35.17Q26.92 35.17 26.15 34.38Q25.38 33.59 25.38 32.29Q25.38 30.83 26.59 29.37Q27.8 27.91 30 26.95Q32.2 26 35.11 26Q38.22 26 40.39 26.87Q42.57 27.73 43.71 29.69Q44.84 31.64 44.84 34.9V46.5Q44.84 47.71 45.33 48.23Q45.81 48.76 46.61 48.76Q47.14 48.76 47.63 48.63Q48.13 48.5 48.67 48.23L48.9 48.57Q47.7 49.99 46.3 50.5Q44.91 51 43.62 51Q41.25 51 40.06 49.85Q38.86 48.7 38.51 46.6Q37.84 48.17 36.9 49.14Q35.96 50.12 34.68 50.56Q33.4 51 31.66 51ZM34.72 48.62Q35.81 48.62 36.57 48.09Q37.34 47.55 37.76 46.59Q38.17 45.63 38.17 44.39V38.3Q35.8 38.37 34.38 38.91Q32.96 39.45 32.36 40.67Q31.75 41.89 31.75 44.03Q31.75 46.39 32.5 47.5Q33.25 48.62 34.72 48.62Z"/>
          <path class="pen" d="M28.5 13.5C31 21.5 42 22.5 45.5 14.5" fill="none" stroke-width="4.2" stroke-linecap="round"/>
        </svg>
        <h1>Diacritificatorul<svg viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">
        <path pathLength="1" d="M3 13 C 70 6, 140 15, 210 9 S 340 6, 397 11"/></svg></h1>
      </div>
      <nav class="menu" aria-label="Meniu">
        <a href="about.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>Despre</a>
        <a href="about.html#cum-functioneaza"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>Cum funcționează</a>
        <a href="https://github.com/Claudiu/ro-diacritics"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>GitHub</a>
      </nav>
    </header>
    <section class="sheet">
      <div class="sheet-head">
        <label for="input"><svg class="icon pen" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>Textul tău</label>
        <button id="example" type="button" disabled><svg class="icon lime" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>Încearcă un exemplu</button>
      </div>
      <textarea id="input" class="page" spellcheck="false" disabled
                placeholder="Scrie aici, de exemplu: Mergem la munte in weekend, daca nu ploua."></textarea>
    </section>

    <section class="sheet" aria-labelledby="output-title">
      <div class="sheet-head">
        <h2 id="output-title"><svg class="icon lime" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 16 6-12 6 12"/><path d="M8 12h8"/><path d="m16 20 2 2 4-4"/></svg>Cu diacritice</h2>
        <button id="copy" type="button" disabled><svg class="icon copy-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><svg class="icon done-i lime" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Copiază</span></button>
      </div>
      <div id="output" class="page" tabindex="0"><span class="empty">Textul cu diacritice apare aici.</span></div>
    </section>
    <footer class="site-foot">
      <p id="status" class="status" role="status">Se încarcă modelul (6 MB)…</p>
      <p class="lede">Scrie fără diacritice și le punem noi la loc. Modelul rulează în
        browserul tău, așa că textul nu pleacă nicăieri.</p>
    </footer>
  </main>

  <script type="module">
    // Written with diacritics so it stays readable here; stripped before it reaches the input.
    const EXAMPLE = `Dimineața, orașul se trezește încet. Brutăriile deschid primele, iar mirosul de pâine caldă se simte pe străzile încă goale. Pe trotuare apar oameni grăbiți spre stații, cu cafeaua într-o mână și telefonul în cealaltă.

Spre prânz, soarele arde asfaltul și terasele se umplu de lume care vorbește despre vacanțe, prețuri și meciul de aseară. Seara, luminile se aprind una câte una, iar orașul pare mai liniștit decât a fost toată ziua.`
      .normalize("NFD").replace(/[\u0302\u0306\u0326\u0327]/g, "").normalize("NFC");

    const status = document.getElementById("status");
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const copy = document.getElementById("copy");
    const example = document.getElementById("example");
    const worker = new Worker("./worker.js", { type: "module" });
    let pending = false;
    let busy = false;
    let sent = "";
    let restored = "";

    const send = () => {
      if (busy) { pending = true; return; }
      busy = true;
      sent = input.value;
      worker.postMessage({ text: sent });
    };

    // Download progress: the title underline follows it; the status line says it in MB,
    // updated every 10% so screen readers do not announce each chunk.
    const title = document.querySelector("h1");
    const mb = (bytes) => (bytes / 1e6).toLocaleString("ro-RO", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
    let shownStep = -1;
    const placeholder = input.placeholder;
    const progress = ({ loaded, total, exact }) => {
      // A compressed download only estimates the total; hold the line short of the end.
      const p = exact ? loaded / total : Math.min(loaded / total, .95);
      title.style.setProperty("--p", p);
      const step = Math.floor(p * 10);
      if (step === shownStep) return;
      shownStep = step;
      status.textContent = !exact ? `Se descarcă modelul: ${mb(loaded)} MB…`
        : p < 1 ? `Se descarcă modelul: ${mb(loaded)} din ${mb(total)} MB…`
        : "Pornesc modelul…";
      input.placeholder = status.textContent;
    };

    const showError = (message) => {
      status.textContent = message;
      status.classList.add("error");
    };

    // Restoring keeps the length, so the letters that differ are the ones the model fixed.
    // A mark is fresh when the previous result had a different letter at that spot.
    const render = (original, text, previous) => {
      output.replaceChildren();
      if (!text) {
        const empty = document.createElement("span");
        empty.className = "empty";
        empty.textContent = "Textul cu diacritice apare aici.";
        output.append(empty);
        return 0;
      }

      const a = [...original];
      const b = [...text];
      const before = [...previous];
      let changed = 0;
      let plain = "";
      for (let i = 0; i < b.length; i++) {
        if (a[i] === b[i]) { plain += b[i]; continue; }
        if (plain) { output.append(plain); plain = ""; }
        const mark = document.createElement("mark");
        mark.textContent = b[i];
        mark.dataset.from = a[i];
        if (before[i] !== b[i]) mark.className = "fresh";
        output.append(mark);
        changed++;
      }
      if (plain) output.append(plain);

      return changed;
    };

    const describe = (changed, chars, ms) => {
      const fixes = changed === 1 ? "o diacritică adăugată" : `${changed} diacritice adăugate`;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = changed ? fixes : "Nicio diacritică de adăugat";
      status.replaceChildren(count, `, ${chars} caractere în ${Math.round(ms)} ms.`);
    };

    // Line n in one pane is line n in the other, so scroll them together.
    let syncing = null;
    function align(from, to) {
      syncing = from;
      const range = from.scrollHeight - from.clientHeight;
      to.scrollTop = range > 0 ? (from.scrollTop / range) * (to.scrollHeight - to.clientHeight) : 0;
      requestAnimationFrame(() => { syncing = null; });
    }
    const follow = (from, to) => from.addEventListener("scroll", () => {
      if (syncing !== to) align(from, to);
    });
    follow(input, output);
    follow(output, input);

    worker.onmessage = ({ data }) => {
      if (data.error) { showError(data.error); busy = false; return; }
      if (data.progress) { progress(data.progress); return; }
      if (data.ready) {
        title.style.setProperty("--p", 1);
        input.placeholder = placeholder;
        status.textContent = `Gata, modelul s-a încărcat în ${data.ms} ms. Poți scrie.`;
        input.maxLength = data.maxChars;
        input.disabled = false;
        example.disabled = false;
        input.focus();
        return;
      }

      busy = false;
      status.classList.remove("error");
      const changed = render(sent, data.text, restored);
      restored = data.text;
      align(input, output);
      copy.disabled = !data.text;
      if (data.text) describe(changed, data.chars, data.ms);
      else status.textContent = "Poți scrie.";
      if (pending) { pending = false; send(); }
    };

    input.addEventListener("input", send);

    // Touch has no hover: a tap shows the replaced letter, another tap hides it.
    output.addEventListener("click", ({ target }) => {
      const mark = target.closest("mark");
      const shown = output.querySelector("mark.shown");
      shown?.classList.remove("shown");
      if (mark && mark !== shown) mark.classList.add("shown");
    });

    example.addEventListener("click", () => {
      input.value = EXAMPLE;
      input.focus();
      send();
    });

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(restored);
        copy.lastChild.textContent = "Copiat";
        copy.classList.add("done");
        setTimeout(() => { copy.lastChild.textContent = "Copiază"; copy.classList.remove("done"); }, 1500);
      } catch {
        showError("Nu am putut copia textul. Selectează-l și copiază-l manual.");
      }
    });
  </script>
</body>
</html>
