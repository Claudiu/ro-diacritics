[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/model",
  "crates/cli",
  "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
diacritics-domain = { path = "crates/domain" }
diacritics-model = { path = "crates/model" }

anyhow = "1.0"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
